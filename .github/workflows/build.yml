name: Build Caddy Docker images

on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: "Caddy version to build (empty = latest GitHub release, e.g. v2.10.0)"
        required: false
        default: ""
        type: string
      forwardproxy_repo:
        description: "Naive variant forwardproxy replacement repo (Go import path, no scheme)."
        required: false
        default: "github.com/klzgrad/forwardproxy"
        type: string
      forwardproxy_version:
        description: "Naive variant forwardproxy replacement branch / tag / commit."
        required: false
        default: "naive"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      caddy_version: ${{ steps.resolve.outputs.caddy_version }}
      forwardproxy_repo: ${{ steps.resolve.outputs.forwardproxy_repo }}
      forwardproxy_version: ${{ steps.resolve.outputs.forwardproxy_version }}
    steps:
      - name: Resolve build inputs
        id: resolve
        run: |
          CADDY_VERSION="${{ inputs.caddy_version }}"
          if [ -z "$CADDY_VERSION" ]; then
            CADDY_VERSION=$(curl -fsSL https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r .tag_name)
            echo "Resolved latest Caddy version: $CADDY_VERSION"
          else
            echo "Using user-supplied Caddy version: $CADDY_VERSION"
          fi

          FP_REPO="${{ inputs.forwardproxy_repo }}"
          FP_VERSION="${{ inputs.forwardproxy_version }}"
          echo "forwardproxy module (naive variant): ${FP_REPO}@${FP_VERSION}"

          {
            echo "caddy_version=${CADDY_VERSION}"
            echo "forwardproxy_repo=${FP_REPO}"
            echo "forwardproxy_version=${FP_VERSION}"
          } >> "$GITHUB_OUTPUT"

  docker:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: plain
            tag_suffix: ""
            description: "Caddy server built with the upstream forwardproxy plugin"
          - variant: naive
            tag_suffix: "-naive"
            description: "Caddy server built with the NaiveProxy forwardproxy plugin"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${IMAGE}" >> $GITHUB_OUTPUT
          echo "Image: ${IMAGE}"

      - name: Compute forwardproxy replacement args
        id: forwardproxy
        env:
          VARIANT: ${{ matrix.variant }}
          FP_REPO: ${{ needs.resolve-version.outputs.forwardproxy_repo }}
          FP_VERSION: ${{ needs.resolve-version.outputs.forwardproxy_version }}
        run: |
          if [ "$VARIANT" = "naive" ]; then
            REPLACEMENT="$FP_REPO"
            VERSION="$FP_VERSION"
          else
            REPLACEMENT=""
            VERSION=""
          fi
          {
            echo "replacement=${REPLACEMENT}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Variant=${VARIANT}; forwardproxy replacement: ${REPLACEMENT:-upstream}${VERSION:+@${VERSION}}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest${{ matrix.tag_suffix }}
            type=raw,value=${{ needs.resolve-version.outputs.caddy_version }}${{ matrix.tag_suffix }}
          labels: |
            org.opencontainers.image.title=Caddy forwardproxy (${{ matrix.variant }})
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.caddy_version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CADDY_VERSION=${{ needs.resolve-version.outputs.caddy_version }}
            FORWARDPROXY_REPLACEMENT=${{ steps.forwardproxy.outputs.replacement }}
            FORWARDPROXY_VERSION=${{ steps.forwardproxy.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
